# Учебный CI: проверка синтаксиса и импорта Python-приложения

name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi pydantic uvicorn pytest httpx ruff
      
      - name: Check syntax
        run: python -m py_compile main.py
      
      - name: Check import
        run: python -c "import main; print('imported OK')"
      
      - name: Lint with Ruff
        run: ruff check .
      
      - name: Run tests
        run: pytest -v test_main.py

  deploy:
    needs: check
    runs-on: ubuntu-latest   # ← ЭТОЙ СТРОКИ НЕ ХВАТАЛО
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE || 'web' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}